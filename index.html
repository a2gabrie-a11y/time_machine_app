<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Machine: Dance Break</title>
  <style>
    body { background: #000; color: #fff; font-family: Georgia, serif; text-align: center; margin: 0; padding-top: 30px; overflow-x: hidden; }
    #site-title { font-size: 4rem; color: #FFD166; text-shadow: 0 0 10px #FFD166, 0 0 25px #FF4FA3; letter-spacing: 6px; margin-bottom: 0; }
    .tagline { font-size: 2.2rem; font-style: italic; color: #FFD166; text-shadow: 0 0 10px #FFD166, 0 0 25px #FF4FA3; margin-top: 30px; animation: pulse 1.2s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: 0.6; transform: scale(1); } to { opacity: 1; transform: scale(1.05); } }

    .stage { display: flex; justify-content: center; align-items: center; gap: 30px; flex-wrap: wrap; min-height: 520px; }
    .screen { position: relative; width: 900px; max-width: 90vw; aspect-ratio: 16 / 9; border: 4px solid #FF4FA3; border-radius: 12px; box-shadow: 0 0 20px #FF4FA3, 0 0 40px #4FC3F7; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .screen iframe { width: 100%; height: 100%; border: none; }
    #tunnel { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #countdown { position: relative; z-index: 2; font-size: 8rem; color: #4FC3F7; text-shadow: 0 0 20px #4FC3F7, 0 0 40px #FF4FA3; }

    #start-btn { font-family: Georgia, serif; font-size: 1.8rem; color: #FFD166; background: transparent; border: 3px solid #FFD166; border-radius: 40px; padding: 15px 40px; cursor: pointer; box-shadow: 0 0 15px #FFD166; }
    #start-btn:hover { background: #FFD166; color: #000; }
    .hidden { display: none; }

    .dancer { width: 280px; animation: bounce 0.6s ease-in-out infinite alternate; }
    .dancer line, .dancer circle { stroke-width: 6; stroke-linecap: round; fill: none; }
    .pink line, .pink circle { stroke: #FF4FA3; filter: drop-shadow(0 0 6px #FF4FA3); }
    .blue line, .blue circle { stroke: #4FC3F7; filter: drop-shadow(0 0 6px #4FC3F7); }
    .blue { animation-delay: 0.3s; }
    .arm { transform-origin: 50px 55px; animation: wave 0.6s ease-in-out infinite alternate; }
    @keyframes bounce { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-15px) rotate(6deg); } }
    @keyframes wave { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }

    /* The rabbit track */
    #track { position: relative; width: 90vw; max-width: 1100px; height: 110px; margin: 10px auto 0; border-bottom: 3px solid #4FC3F7; box-shadow: 0 6px 10px -6px #4FC3F7; overflow: hidden; }
    #rabbit { position: absolute; bottom: 4px; left: 50%; width: 140px; transform: translateX(-50%); }
    #rabbit path, #rabbit circle { fill: none; stroke: #FFD166; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 6px #FFD166); }
    #rabbit.running { animation: run-across 6s linear infinite; }
    @keyframes run-across { from { left: -10%; } to { left: 110%; } }
    #time-left { font-size: 1.5rem; color: #FFD166; text-shadow: 0 0 10px #FFD166; margin-bottom: 15px; }

    /* The two small buttons under the timer */
    #controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
    .small-btn { font-family: Georgia, serif; font-size: 1rem; color: #4FC3F7; background: transparent; border: 2px solid #4FC3F7; border-radius: 30px; padding: 8px 22px; cursor: pointer; box-shadow: 0 0 10px #4FC3F7; }
    .small-btn:hover { background: #4FC3F7; color: #000; }

    /* The breathing cool-down */
    .breath-box { position: absolute; inset: 0; z-index: 2; display: flex; justify-content: center; align-items: center; }
    .breath-circle { width: 200px; height: 200px; border-radius: 50%; border: 4px solid #4FC3F7; box-shadow: 0 0 25px #4FC3F7, inset 0 0 25px #FF4FA3; transform: scale(0.6); transition: transform 4s ease-in-out; }
    .breath-circle.inhale { transform: scale(1.3); }
    .breath-text { position: absolute; bottom: 6%; left: 0; right: 0; margin: 0; font-size: 2.5rem; color: #FFD166; text-shadow: 0 0 10px #FFD166, 0 0 25px #FF4FA3; }
  </style>
</head>
<body>
  <h1 id="site-title">TIME MACHINE</h1>

  <div class="stage">
    <svg class="dancer pink" viewBox="0 0 100 160">
      <circle cx="50" cy="25" r="15"/>
      <line x1="50" y1="40" x2="50" y2="100"/>
      <g class="arm"><line x1="50" y1="55" x2="15" y2="35"/><line x1="50" y1="55" x2="85" y2="35"/></g>
      <line x1="50" y1="100" x2="25" y2="150"/>
      <line x1="50" y1="100" x2="75" y2="150"/>
    </svg>

    <div class="screen" id="screen">
      <video id="tunnel" class="hidden" src="tunnel.mp4" muted loop playsinline></video>
      <button id="start-btn">Take a dance break</button>
      <div id="countdown" class="hidden"></div>
    </div>

    <svg class="dancer blue" viewBox="0 0 100 160">
      <circle cx="50" cy="25" r="15"/>
      <line x1="50" y1="40" x2="50" y2="100"/>
      <g class="arm"><line x1="50" y1="55" x2="15" y2="35"/><line x1="50" y1="55" x2="85" y2="35"/></g>
      <line x1="50" y1="100" x2="25" y2="150"/>
      <line x1="50" y1="100" x2="75" y2="150"/>
    </svg>
  </div>

  <p class="tagline">Dance like no one's watching</p>

  <div id="track">
    <div id="rabbit">
      <svg viewBox="0 0 140 70">
        <!-- Pose 1: stretched out mid-leap -->
        <g id="pose-leap">
          <path d="M30 38 Q55 22 90 30 Q100 34 96 42 Q80 48 40 46 Q28 45 30 38 Z"/>
          <circle cx="104" cy="30" r="10"/>
          <path d="M100 22 Q92 6 82 4 Q90 14 98 24"/>
          <path d="M106 21 Q104 5 96 2 Q100 14 103 22"/>
          <path d="M90 42 L124 52"/>
          <path d="M34 44 L4 56"/>
          <circle cx="26" cy="36" r="4"/>
        </g>
        <!-- Pose 2: legs tucked in -->
        <g id="pose-tuck" class="hidden">
          <path d="M40 40 Q50 18 80 22 Q96 26 92 40 Q86 50 60 50 Q42 50 40 40 Z"/>
          <circle cx="100" cy="26" r="10"/>
          <path d="M96 18 Q90 4 80 2 Q88 10 94 20"/>
          <path d="M103 17 Q101 3 94 1 Q98 10 100 18"/>
          <path d="M84 46 L72 62"/>
          <path d="M48 48 L64 62"/>
          <circle cx="37" cy="36" r="4"/>
        </g>
      </svg>
    </div>
  </div>
  <p id="time-left">5:00</p>

  <div id="controls" class="hidden">
    <button id="more-btn" class="small-btn">One more song</button>
    <button id="cool-btn" class="small-btn">Cool down</button>
  </div>

  <script>
    const startBtn = document.getElementById("start-btn");
    const countdown = document.getElementById("countdown");
    const screen = document.getElementById("screen");
    const tunnel = document.getElementById("tunnel");
    const controls = document.getElementById("controls");
    const moreBtn = document.getElementById("more-btn");
    const coolBtn = document.getElementById("cool-btn");
    const rabbit = document.getElementById("rabbit");
    const leap = document.getElementById("pose-leap");
    const tuck = document.getElementById("pose-tuck");
    const label = document.getElementById("time-left");

    // These are shared by several functions, so they live out here
    let secondsLeft = 300; // 5 minutes in seconds
    let clockTimer;
    let legsTimer;
    let breathTimer;
    let playedIds = [];      // songs already played this round
    let breathingIn = false; // true while breathing in

    // The browser says a word in a low voice
    function speak(word, rate = 0.9) {
      const voice = new SpeechSynthesisUtterance(word);
      voice.pitch = 0.5;  // 0 is lowest, 1 is normal, 2 is highest
      voice.rate = rate;  // 0.9 is a little slower than normal
      speechSynthesis.speak(voice);
    }

    // Swap the rabbit's two poses so it looks like running
    function moveLegs(speed) {
      clearInterval(legsTimer);
      legsTimer = setInterval(() => {
        leap.classList.toggle("hidden");
        tuck.classList.toggle("hidden");
      }, speed);
    }

    // The rabbit runs laps while the clock counts down
    function startRabbit() {
      rabbit.classList.add("running");
      moveLegs(150);

      clockTimer = setInterval(() => {
        secondsLeft--;
        const min = Math.floor(secondsLeft / 60);
        const sec = String(secondsLeft % 60).padStart(2, "0");
        label.textContent = min + ":" + sec;

        if (secondsLeft <= 0) {
          endBreak();
        }
      }, 1000);
    }

    // The rabbit stops in the middle and sits down
    function sitRabbit() {
      clearInterval(legsTimer);
      rabbit.classList.remove("running");
      leap.classList.add("hidden");
      tuck.classList.remove("hidden");
    }

    // Time's up: everything stops
    function endBreak() {
      secondsLeft = 0;
      clearInterval(clockTimer);
      clearInterval(breathTimer);
      sitRabbit();
      controls.classList.add("hidden");
      label.textContent = "Break's over! Back to work.";
    }

    // The DJ's crate: the app picks one of these at random
    const songs = [
      { title: "ABBA – Mamma Mia", id: "unfzfe8f9NI" },
      { title: "Fedde Le Grand ft. Ida Corr – Let Me Think About It", id: "7gkhE7t4KCE" },
      { title: "Daft Punk – Around the World", id: "K0HSD_i2DvA" },
      { title: "PSY – Gangnam Style", id: "9bZkp7q19f0" },
      { title: "Stromae – Alors on danse", id: "VHoT4N43jK8" },
      { title: "Imael Angel feat. Cali Bee – Bad Times", id: "8C64lkuhnuU" },
      { title: "SAINt JHN – Roses (Imanbek Remix)", id: "2zToEPpFEN8" },
      { title: "Kool & The Gang – Celebration", id: "3GwjfUFyY6M" },
      { title: "Alex Gaudino feat. Crystal Waters – Destination Calabria", id: "Kq4OtRsdXls" },
      { title: "Money Play", id: "gLoN-u4kR90" }
    ];

    // Pick a random song that hasn't played yet this round, and put it in the neon screen
    function playRandomSong() {
      if (secondsLeft <= 0) return; // the break is over

      let choices = songs.filter(song => !playedIds.includes(song.id));
      if (choices.length === 0) {
        // Every song has played: start a new round, but not with the last song
        const lastId = playedIds[playedIds.length - 1];
        playedIds = [];
        choices = songs.filter(song => song.id !== lastId);
      }
      const song = choices[Math.floor(Math.random() * choices.length)];
      playedIds.push(song.id);

      const frame = document.createElement("iframe");
      frame.src = "https://www.youtube.com/embed/" + song.id + "?autoplay=1";
      frame.title = song.title;
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allow = "autoplay; encrypted-media";
      frame.allowFullscreen = true;
      screen.replaceChildren(frame);
    }

    // One breath: the circle, the words and the voice all change together
    function breathe(circle, words) {
      breathingIn = !breathingIn;
      if (breathingIn) {
        circle.classList.add("inhale");
        words.textContent = "Breathe in";
        speak("Breathe in", 0.7);
      } else {
        circle.classList.remove("inhale");
        words.textContent = "Breathe out";
        speak("Breathe out", 0.7);
      }
    }

    // The cool-down: slow tunnel, breathing circle, the rabbit rests, 2 minutes left
    function startCoolDown() {
      if (secondsLeft <= 0) return; // the break is over
      controls.classList.add("hidden");

      // The tunnel clip plays slowly behind the breathing circle
      const calmTunnel = document.createElement("video");
      calmTunnel.id = "tunnel";
      calmTunnel.src = "tunnel.mp4";
      calmTunnel.muted = true;
      calmTunnel.loop = true;
      calmTunnel.playsInline = true;

      const box = document.createElement("div");
      box.className = "breath-box";
      const circle = document.createElement("div");
      circle.className = "breath-circle";
      const words = document.createElement("p");
      words.className = "breath-text";
      box.append(circle, words);

      screen.replaceChildren(calmTunnel, box);
      calmTunnel.playbackRate = 0.5; // half speed, so it feels calm
      calmTunnel.play();

      // 4 seconds in, 4 seconds out. The first breath starts right away.
      breathingIn = false;
      setTimeout(() => breathe(circle, words), 50);
      breathTimer = setInterval(() => breathe(circle, words), 4000);

      // The rabbit rests too
      sitRabbit();

      // The cool-down lasts 2 minutes
      if (secondsLeft > 120) {
        secondsLeft = 120;
      }
    }

    // The button: tunnel + "Ready, Set, Dance!", then the video and the rabbit start
    startBtn.addEventListener("click", () => {
      startBtn.classList.add("hidden");
      tunnel.classList.remove("hidden");
      tunnel.play();
      countdown.classList.remove("hidden");

      const steps = ["Ready", "Set", "Dance!"];
      let step = 0;
      countdown.textContent = steps[step];
      speak(steps[step]);

      const timer = setInterval(() => {
        step++;
        if (step < steps.length) {
          countdown.textContent = steps[step];
          speak(steps[step]);
        } else {
          clearInterval(timer);
          playRandomSong();
          startRabbit();
          controls.classList.remove("hidden");
        }
      }, 1100);
    });

    moreBtn.addEventListener("click", playRandomSong);
    coolBtn.addEventListener("click", startCoolDown);
  </script>
</body>
</html>
