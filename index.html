<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Machine: Dance Break</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Georgia, serif;
      text-align: center;
      margin: 0;
      padding-top: 30px;
    }
    #site-title {
      font-size: 4rem;
      color: #FFD166;
      text-shadow: 0 0 10px #FFD166, 0 0 25px #FF4FA3;
      letter-spacing: 6px;
      margin-bottom: 0;
    }
    .tagline {
      font-size: 2.2rem;
      font-style: italic;
      color: #FFD166;
      text-shadow: 0 0 10px #FFD166, 0 0 25px #FF4FA3;
      margin-top: 30px;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.6; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.05); }
    }
    #hourglass-box {
      margin: 20px 0 40px;
      color: #FFD166;
      font-size: 1.5rem;
      text-shadow: 0 0 10px #FFD166, 0 0 25px #FF4FA3;
    }
    #hourglass {
      width: 120px;
      filter: drop-shadow(0 0 8px #4FC3F7);
    }
    .glass-outline {
      fill: none;
      stroke: #4FC3F7;
      stroke-width: 3;
      stroke-linejoin: round;
    }
    .sand {
      fill: #FFD166;
    }
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
      min-height: 520px;
    }
    .screen {
      width: 900px;
      max-width: 90vw;
      aspect-ratio: 16 / 9;
      border: 4px solid #FF4FA3;
      border-radius: 12px;
      box-shadow: 0 0 20px #FF4FA3, 0 0 40px #4FC3F7;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .screen iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #start-btn {
      font-family: Georgia, serif;
      font-size: 1.8rem;
      color: #FFD166;
      background: transparent;
      border: 3px solid #FFD166;
      border-radius: 40px;
      padding: 15px 40px;
      cursor: pointer;
      box-shadow: 0 0 15px #FFD166;
    }
    #start-btn:hover {
      background: #FFD166;
      color: #000;
    }
    #countdown {
      font-size: 10rem;
      color: #4FC3F7;
      text-shadow: 0 0 20px #4FC3F7, 0 0 40px #FF4FA3;
    }
    .hidden {
      display: none;
    }
    .dancer {
      width: 280px;
      animation: bounce 0.6s ease-in-out infinite alternate;
    }
    .dancer line, .dancer circle {
      stroke-width: 6;
      stroke-linecap: round;
      fill: none;
    }
    .pink line, .pink circle { stroke: #FF4FA3; filter: drop-shadow(0 0 6px #FF4FA3); }
    .blue line, .blue circle { stroke: #4FC3F7; filter: drop-shadow(0 0 6px #4FC3F7); }
    .blue { animation-delay: 0.3s; }
    .arm {
      transform-origin: 50px 55px;
      animation: wave 0.6s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0) rotate(-6deg); }
      to   { transform: translateY(-15px) rotate(6deg); }
    }
    @keyframes wave {
      from { transform: rotate(-25deg); }
      to   { transform: rotate(25deg); }
    }
  </style>
</head>
<body>
  <h1 id="site-title">TIME MACHINE</h1>

  <div class="stage">
    <svg class="dancer pink" viewBox="0 0 100 160">
      <circle cx="50" cy="25" r="15"/>
      <line x1="50" y1="40" x2="50" y2="100"/>
      <g class="arm"><line x1="50" y1="55" x2="15" y2="35"/><line x1="50" y1="55" x2="85" y2="35"/></g>
      <line x1="50" y1="100" x2="25" y2="150"/>
      <line x1="50" y1="100" x2="75" y2="150"/>
    </svg>

    <div class="screen" id="screen">
      <button id="start-btn">Take a dance break</button>
      <div id="countdown" class="hidden"></div>
    </div>

    <svg class="dancer blue" viewBox="0 0 100 160">
      <circle cx="50" cy="25" r="15"/>
      <line x1="50" y1="40" x2="50" y2="100"/>
      <g class="arm"><line x1="50" y1="55" x2="15" y2="35"/><line x1="50" y1="55" x2="85" y2="35"/></g>
      <line x1="50" y1="100" x2="25" y2="150"/>
      <line x1="50" y1="100" x2="75" y2="150"/>
    </svg>
  </div>

  <p class="tagline">Dance like no one's watching</p>

  <div id="hourglass-box">
    <svg id="hourglass" viewBox="0 0 100 170">
      <defs>
        <clipPath id="glass-shape">
          <polygon points="15,10 85,10 55,85 85,160 15,160 45,85"/>
        </clipPath>
      </defs>
      <g clip-path="url(#glass-shape)">
        <rect id="sand-top" class="sand" x="0" y="15" width="100" height="65"/>
        <rect id="sand-bottom" class="sand" x="0" y="160" width="100" height="0"/>
      </g>
      <polygon class="glass-outline" points="15,10 85,10 55,85 85,160 15,160 45,85"/>
    </svg>
    <p id="time-left">5:00</p>
  </div>

  <script>
    const startBtn = document.getElementById("start-btn");
    const countdown = document.getElementById("countdown");
    const screen = document.getElementById("screen");

    // The hourglass: sand falls over 5 minutes
    function startHourglass() {
      const total = 300; // 5 minutes in seconds
      let secondsLeft = total;
      const top = document.getElementById("sand-top");
      const bottom = document.getElementById("sand-bottom");
      const label = document.getElementById("time-left");

      const sandTimer = setInterval(() => {
        secondsLeft--;
        const fallen = (total - secondsLeft) / total; // goes from 0 to 1

        top.setAttribute("y", 15 + 65 * fallen);
        top.setAttribute("height", 65 * (1 - fallen));
        bottom.setAttribute("y", 160 - 70 * fallen);
        bottom.setAttribute("height", 70 * fallen);

        const min = Math.floor(secondsLeft / 60);
        const sec = String(secondsLeft % 60).padStart(2, "0");
        label.textContent = min + ":" + sec;

        if (secondsLeft <= 0) {
          clearInterval(sandTimer);
          label.textContent = "Break's over! Back to work.";
        }
      }, 1000);
    }

    // The button: 3-2-1 countdown, then the video and the hourglass start
    startBtn.addEventListener("click", () => {
      startBtn.classList.add("hidden");
      countdown.classList.remove("hidden");

      let number = 3;
      countdown.textContent = number;

      const timer = setInterval(() => {
        number--;
        if (number > 0) {
          countdown.textContent = number;
        } else {
          clearInterval(timer);
          screen.innerHTML = '<iframe src="https://www.youtube.com/embed/unfzfe8f9NI?autoplay=1" title="ABBA - Mamma Mia" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
          startHourglass();
        }
      }, 1000);
    });
  </script>
</body>
</html>
